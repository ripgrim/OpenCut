name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GPUI links against these on Linux; see apps/desktop/README.md.
      - name: Install GPUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libfontconfig-dev cmake

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      - name: Install JavaScript dependencies
        run: |
          bun install --cwd apps/web --frozen-lockfile
          bun install --cwd apps/api --frozen-lockfile

      # Pull requests: only what the diff touches. Pushes to main and manual runs: the
      # whole graph, because moon ci compares HEAD~1..HEAD there and can resolve nothing.
      - name: Run CI (affected by this PR)
        if: github.event_name == 'pull_request'
        run: moon ci

      - name: Run CI (all projects)
        if: github.event_name != 'pull_request'
        run: moon run :check :build :test
